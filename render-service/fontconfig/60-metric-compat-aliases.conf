<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Metric-compatible open-font substitution aliases (R062 criterion 3 / 37-RESEARCH.md
  Pitfall 2 and assumption A4).

  Installing fonts-crosextra-carlito/-caladea/fonts-liberation (see ../Dockerfile) makes the
  glyphs AVAILABLE, but does not by itself tell LibreOffice to SUBSTITUTE a document's
  declared "Calibri"/"Cambria" font family with them -- those are two separate configuration
  surfaces. Without this file, a Calibri deck can silently fall back to LibreOffice's own
  generic default (historically Liberation Sans), which is still not a Microsoft font but is
  visually wrong. This file closes that gap explicitly rather than assuming it.
-->
<fontconfig>
  <alias binding="same">
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Cambria</family>
    <prefer>
      <family>Caladea</family>
    </prefer>
  </alias>
</fontconfig>
